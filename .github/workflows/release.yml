name: release

# Analysis-Tool 自建发版（无 semantic-release）：
#   - push 到 main     -> beta（VERSION 文件 + BUILD+1，不发 GitHub Release）
#   - push tag X.Y.Z.0 -> stable（取 tag，发 GitHub Release 并设 latest）
on:
  push:
    branches: [main]
    tags: ['*.*.*.0']
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine channel and version
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL=stable; TAG="$GITHUB_REF_NAME"
          else
            CHANNEL=beta; TAG=""
          fi
          echo "channel=$CHANNEL tag=$TAG"
          bash ci/determine-version.sh "$CHANNEL" 'Analysis-Tool-For-ColorOS' VERSION "$TAG"

      # 干净源码副本供打包（pack-all.sh 从 ./repo 取源码）
      - name: Checkout source for packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 1

      - name: Prepare (changelog + pack 8 platforms)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/prepare-release.sh 'Analysis-Tool-For-ColorOS' "$CHANNEL" "$VERSION_NAME" "$VERSION_CODE"

      - name: Upload to OpenList (signed version.json)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          OPENLIST_STORAGE_DIR: ${{ secrets.SERVER_OPENLIST_DIR }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: bash ci/upload-openlist.sh

      - name: Create GitHub Release (stable only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create "$VERSION_NAME" output/*.zip \
            --title "$VERSION_NAME" --notes-file release.md --verify-tag
          gh release edit "$VERSION_NAME" --latest
