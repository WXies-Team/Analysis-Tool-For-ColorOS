name: rollback-openlist

# 撤回已发布版本：把 OpenList 通道指针重新指向一个已存在的不可变版本目录。
# 具体逻辑全部在 ci/rollback-openlist.sh（registry.yaml 分发）；本 workflow 只做输入与 secrets 传递。
# 回滚不重新构建、不覆盖产物；切换后做 HTTP 验证，失败自动恢复；删除默认仅归档。
on:
  workflow_dispatch:
    inputs:
      channel:
        description: '通道（beta / stable）'
        required: true
        type: choice
        default: beta
        options: [stable, beta]
      target_version:
        description: '要恢复的目标版本目录名（如 1.2.3 或 1.2.3-beta.1）'
        required: true
        type: string
      drop_version:
        description: '要撤回的版本目录名（留空则不撤；默认仅归档，不彻底删除）'
        required: false
        type: string
        default: ''
      dry_run:
        description: '仅预检不修改（建议先跑一次）'
        required: false
        type: boolean
        default: true
      purge:
        description: '彻底删除撤回版本（默认 false=仅归档；需同时填 CONFIRM）'
        required: false
        type: boolean
        default: false
      confirm:
        description: '填 ROLLBACK 才允许撤回版本（防误删）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rollback OpenList channel
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          OPENLIST_STORAGE_DIR: ${{ secrets.SERVER_OPENLIST_DIR }}
          CHANNEL: ${{ inputs.channel }}
          TARGET_VERSION: ${{ inputs.target_version }}
          DROP_VERSION: ${{ inputs.drop_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          PURGE: ${{ inputs.purge }}
          CONFIRM: ${{ inputs.confirm }}
        run: bash ci/rollback-openlist.sh
